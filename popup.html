<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adjusting Writing Style</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header: Brand & Active Domain Badge -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo" aria-hidden="true">A</div>
        <div class="brand-text">
          <h1 class="brand-title">Writing Style</h1>
          <p class="brand-subtitle">Term Replacer</p>
        </div>
      </div>
      <div id="site-badge" class="site-badge" title="Active website">
        <span class="status-dot"></span>
        <span id="site-hostname" class="site-hostname">Detecting site...</span>
      </div>
    </header>

    <!-- Toolbar: Home, Login, Import, Export -->
    <nav class="toolbar-nav" aria-label="Toolbar navigation">
      <button type="button" id="btn-home" class="btn-tool" title="Home / Reset view" aria-label="Home">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </button>

      <button type="button" id="btn-login" class="btn-tool" title="Sign in / Sync" aria-label="Login">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span id="login-label">Login</span>
      </button>

      <button type="button" id="btn-import" class="btn-tool" title="Import .txt dictionary" aria-label="Import dictionary">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" x2="12" y1="3" y2="15"/>
        </svg>
        <span>Import</span>
      </button>
      <input type="file" id="file-import-input" accept=".txt" style="display: none;" aria-hidden="true">

      <button type="button" id="btn-export" class="btn-tool" title="Export .txt dictionary" aria-label="Export dictionary">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" x2="12" y1="15" y2="3"/>
        </svg>
        <span>Export</span>
      </button>
    </nav>

    <!-- Feedback Banner -->
    <div id="feedback-banner" class="feedback-banner" style="display: none;" role="alert"></div>

    <!-- Input Card -->
    <section class="card-input" aria-labelledby="input-section-heading">
      <h2 id="input-section-heading" class="section-title">Add Term Pair</h2>
      
      <form id="form-add-term" class="term-form" novalidate>
        <div class="inputs-grid">
          <div class="form-group">
            <label for="input-original" class="input-label">Original Term</label>
            <input type="text" id="input-original" class="text-input" placeholder="e.g. Crimson" autocomplete="off" required>
          </div>

          <div class="arrow-indicator" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="m12 5 7 7-7 7"/>
            </svg>
          </div>

          <div class="form-group">
            <label for="input-replacement" class="input-label">Replacement</label>
            <input type="text" id="input-replacement" class="text-input" placeholder="e.g. Scarlet" autocomplete="off" required>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label" title="Automatically handle lower, Title Case, and UPPERCASE">
            <input type="checkbox" id="check-preserve-case" checked>
            <span>Preserve letter casing (Aa)</span>
          </label>
        </div>

        <button type="submit" id="btn-add-term" class="btn-primary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14"/>
            <path d="M5 12h14"/>
          </svg>
          <span>Add to Dictionary</span>
        </button>
      </form>
    </section>

    <!-- Scrollable Term List Card -->
    <section class="card-list" aria-labelledby="list-section-heading">
      <div class="list-header">
        <h2 id="list-section-heading" class="section-title">
          Saved Terms (<span id="term-count">0</span>)
        </h2>
        <button type="button" id="btn-clear-all" class="btn-link-danger" title="Clear all saved terms">
          Clear all
        </button>
      </div>

      <div id="term-list-container" class="term-list-scrollable" tabindex="0" aria-label="Scrollable term list">
        <div id="empty-state" class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
            <path d="M6 6h10"/>
            <path d="M6 10h7"/>
          </svg>
          <p class="empty-title">No terms saved yet</p>
          <p class="empty-desc">Add a term pair above or click <strong>Import</strong> to load from a .txt file.</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <span class="footer-note">Standalone • In-browser in-place replacement</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
